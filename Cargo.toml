[package]
name    = "fbgl"
version = "0.2.2"
edition = "2021"

[dependencies]
anyhow      = "1.0.102"
bytemuck    = "1.25.0"
framebuffer = { version = "0.3.1", optional = true }
fontdue     = { version = "0.9.3", optional = true }
image       = { version = "0.25.9", optional = true }
sdl2        = { version = "0.38.0", optional = true }

[features]
default = [ "fbdev", "text", "img", "sdl" ]
fbdev   = [ "framebuffer" ]
img     = [ "image" ]
sdl     = [ "sdl2" ]
text    = [ "fontdue" ]
