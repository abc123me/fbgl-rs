[package]
name = "fbgl"
version = "0.1.1"
edition = "2021"

[dependencies]
framebuffer = { version = "0.3.1", optional = true }
fontdue = { version = "0.9.3", optional = true }
image = { version = "0.25.9", optional = true }

[features]
default = [ "fbdev", "text", "img" ]
fbdev = [ "framebuffer" ]
text = [ "fontdue" ]
img = [ "image" ]
